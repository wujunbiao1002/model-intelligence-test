# nginx 配置示例：把 your-domain.com 和证书路径换成自己的。
# 前端必须和 sub2api 同域（页面直接请求同域的 /api/v1 和 /v1），
# 下面的 location 加进 sub2api 所在的 server 块即可。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your-domain.com;

    ssl_certificate /etc/nginx/certs/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/your-domain.com/privkey.pem;

    # 模型智能测试站点
    location /model-intelligence-test/ {
        alias /usr/share/nginx/html/model-intelligence-test/;
        index index.html;
        try_files $uri $uri/ /model-intelligence-test/index.html =404;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 保留登录参数的路径归一化
    location = /model-intelligence-test {
        return 302 /model-intelligence-test/$is_args$args;
    }

    # Next.js 静态资源缓存
    location ^~ /model-intelligence-test/_next/ {
        alias /usr/share/nginx/html/model-intelligence-test/_next/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 系统检测结果（定时脚本写入 web 目录下的 data/）
    location ^~ /model-intelligence-test/data/ {
        alias /usr/share/nginx/html/model-intelligence-test/data/;
        expires -1;
        add_header Cache-Control "no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # sub2api 自身的反向代理（/、/api/、/v1/ 等）保持你原有的配置
}
