server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tokenhub.junly.top;

    ssl_certificate /etc/nginx/certs/tokenhub.junly.top/tokenhub.junly.top.pem;
    ssl_certificate_key /etc/nginx/certs/tokenhub.junly.top/tokenhub.junly.top.key;
    include /etc/nginx/snippets/ssl.conf;
    include /etc/nginx/snippets/security-headers.conf;

    # 模型智能测试站点
    location /model-intelligence-test/ {
        alias /usr/share/nginx/html/model-intelligence-test/;
        index index.html;
        try_files $uri $uri/ /model-intelligence-test/index.html =404;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # 保留登录参数的路径归一化
    location = /model-intelligence-test {
        return 302 /model-intelligence-test/$is_args$args;
    }

    # Next.js 静态资源缓存
    location ^~ /model-intelligence-test/_next/ {
        alias /usr/share/nginx/html/model-intelligence-test/_next/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 系统测试结果数据（定时脚本写入）
    location ^~ /model-intelligence-test/data/ {
        alias /usr/share/nginx/html/model-intelligence-test-data/;
        expires -1;
        add_header Cache-Control "no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 其他已有配置（junly-studio、infinite-canvas、sub2api）
    # ...
}
